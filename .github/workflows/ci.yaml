name: ATÉ case management checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie@sha256:7a7e9f22015b67edb4bef5c59daeebcd7e74bfa570df6ce60ae01237c8648a84
        env:
          POSTGRES_USER: ate_test
          POSTGRES_PASSWORD: synthetic-ci-test-password
          POSTGRES_DB: ate_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ate_test -d ate_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ATE_TEST_DATABASE_URL: postgresql://ate_test:synthetic-ci-test-password@127.0.0.1:5432/ate_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.12"
      - run: uv sync --locked
      - run: uv run --locked ruff check . ../worker ../../scripts
      - run: uv run --locked ruff format --check . ../worker ../../scripts
      - run: uv run --locked python -m mypy
      - run: uv run --locked python -m pytest -q
      - run: uv run --locked python ../../scripts/export_openapi.py --check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.8.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run contracts:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure synthetic local credentials
        run: cp .env.example .env
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.8.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install live browser checks
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate core, development, and optional profile configurations
        run: |
          docker compose --profile elastic config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml --profile elastic config --quiet
      - name: Build and start core services
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Validate web proxy and real dependency / worker health
        run: |
          curl --fail http://127.0.0.1:8080/
          curl --fail http://127.0.0.1:8080/api/v1/health
          curl --fail http://127.0.0.1:8080/api/v1/health/ready
          docker compose run --rm --no-deps migrate
          docker compose run --rm --no-deps migrate
          docker compose exec -T api python -m sentinelforge.smoke
      - name: Prove persistence across container recreation
        shell: pwsh
        run: ./scripts/test-persistence.ps1
      - name: Verify analyst workflow, restart persistence, and conflicts in browsers
        working-directory: apps/web
        env:
          ATE_LIVE_ALLOW_RESTART: "1"
        run: npm run test:live
      - name: Capture service status and bounded logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --tail 100
      - name: Stop without removing named volumes
        if: always()
        run: docker compose down --timeout 30
