# Explicit opt-in: docker compose -f compose.yaml -f compose.dev.yaml up --build -d
services:
  api:
    command: [python, -m, uvicorn, sentinelforge.main:create_app, --factory, --host, 0.0.0.0, --port, "8000", --reload, --reload-dir, /app/sentinelforge, --no-access-log]
    volumes: [./apps/api/sentinelforge:/app/sentinelforge:ro]
  web:
    build: { target: dev }
    read_only: false
    mem_limit: 512m
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./apps/web/src:/app/src:ro
      - ./apps/web/index.html:/app/index.html:ro
      - ./apps/web/vite.config.ts:/app/vite.config.ts:ro
  worker:
    volumes:
      - ./apps/api/sentinelforge:/app/sentinelforge:ro
      - ./apps/worker:/worker:ro
